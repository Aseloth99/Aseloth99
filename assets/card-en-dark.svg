<text x="232" y="135" font-size="18" font-weight="600" fill="#b6c0cc">Computer Engineer · Research Assistant</text>
<text x="232" y="160" font-size="17" fill="#8c97a7">Karamanoğlu Mehmetbey University</text>
<text x="388.923" y="200.5" text-anchor="middle"><tspan font-size="16" font-weight="700" fill="#e4e9f0">Now:</tspan><tspan font-size="16" fill="#b6c0cc"> working on my thesis</tspan></text>
<rect x="64" y="252" width="4" height="17" rx="2" fill="#7ea6ff"/>
<text x="79" y="266" font-size="14.5" font-weight="700" letter-spacing="2.2" fill="#8c97a7">ABOUT</text>
<text x="64" y="298" font-size="17.5" fill="#b6c0cc">I build my own projects in software, AI and embedded / IoT. My research is on</text>
<text x="64" y="324" font-size="17.5" fill="#b6c0cc">electric vehicles and batteries, and right now I’m focused on my thesis.</text>
<text x="129.164" y="372.5" font-size="16" font-weight="600" text-anchor="middle" fill="#e4e9f0">Software</text>
<text x="241.127" y="372.5" font-size="16" font-weight="600" text-anchor="middle" fill="#e4e9f0">AI</text>
<text x="381.442" y="372.5" font-size="16" font-weight="600" text-anchor="middle" fill="#e4e9f0">Embedded / IoT</text>
<text x="559.891" y="372.5" font-size="16" font-weight="600" text-anchor="middle" fill="#e4e9f0">3D Printing</text>
<text x="691.401" y="372.5" font-size="16" font-weight="600" text-anchor="middle" fill="#e4e9f0">Web</text>
<rect x="64" y="412" width="4" height="17" rx="2" fill="#7ea6ff"/>
<text x="79" y="426" font-size="14.5" font-weight="700" letter-spacing="2.2" fill="#8c97a7">RESEARCH INTERESTS</text>
<text x="134" y="481" font-size="17" font-weight="700" fill="#e4e9f0">Artificial intelligence</text>
<text x="428.191" y="481" font-size="15.5" fill="#8c97a7">projects and research</text>
<text x="134" y="527" font-size="17" font-weight="700" fill="#e4e9f0">Embedded systems &amp; IoT</text>
<text x="428.191" y="527" font-size="15.5" fill="#8c97a7">my own projects</text>
<text x="134" y="573" font-size="17" font-weight="700" fill="#e4e9f0">Robotics</text>
<text x="428.191" y="573" font-size="15.5" fill="#8c97a7">autonomous systems</text>
<text x="134" y="619" font-size="17" font-weight="700" fill="#e4e9f0">Route &amp; charging optimisation</text>
<text x="428.191" y="619" font-size="15.5" fill="#8c97a7">electric vehicles · EVRoute</text>
