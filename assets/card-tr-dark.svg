<rect x="64" y="236" width="4" height="17" rx="2" fill="#7ea6ff"/>
<text x="79" y="250" font-size="13.5" font-weight="700" letter-spacing="2.2" fill="#8c97a7">HAKKIMDA</text>
<text x="64" y="282" font-size="16" fill="#b6c0cc">Yazılım, yapay zekâ ve gömülü / IoT alanlarında kendi projelerimi geliştiriyorum.</text>
<text x="64" y="306" font-size="16" fill="#b6c0cc">Araştırmalarım elektrikli araçlar ve bataryalar üzerine; şu an tezime odaklanıyorum.</text>
<text x="119.48" y="352" font-size="14.5" font-weight="600" text-anchor="middle" fill="#e4e9f0">Yazılım</text>
<text x="256.85" y="352" font-size="14.5" font-weight="600" text-anchor="middle" fill="#e4e9f0">Yapay Zekâ</text>
<text x="415.47" y="352" font-size="14.5" font-weight="600" text-anchor="middle" fill="#e4e9f0">Gömülü / IoT</text>
<text x="563.891" y="352" font-size="14.5" font-weight="600" text-anchor="middle" fill="#e4e9f0">3B Baskı</text>
<text x="680.417" y="352" font-size="14.5" font-weight="600" text-anchor="middle" fill="#e4e9f0">Web</text>
<rect x="64" y="390" width="4" height="17" rx="2" fill="#7ea6ff"/>
<text x="79" y="404" font-size="13.5" font-weight="700" letter-spacing="2.2" fill="#8c97a7">ARAŞTIRMA İLGİ ALANLARI</text>
<text x="134" y="457" font-size="15.5" font-weight="700" fill="#e4e9f0">Yapay zekâ</text>
<text x="376.759" y="457" font-size="14.5" fill="#8c97a7">projeler ve araştırma</text>
<text x="134" y="499" font-size="15.5" font-weight="700" fill="#e4e9f0">Gömülü sistemler ve IoT</text>
<text x="376.759" y="499" font-size="14.5" fill="#8c97a7">kendi projelerim</text>
<text x="134" y="541" font-size="15.5" font-weight="700" fill="#e4e9f0">Robotik</text>
<text x="376.759" y="541" font-size="14.5" fill="#8c97a7">otonom sistemler</text>
<text x="134" y="583" font-size="15.5" font-weight="700" fill="#e4e9f0">Rota ve şarj optimizasyonu</text>
<text x="376.759" y="583" font-size="14.5" fill="#8c97a7">elektrikli araçlar · EVRoute</text>
