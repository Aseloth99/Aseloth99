<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Mustafa Açık — Bilgisayar Mühendisi · Computer Engineer">
  <defs><linearGradient id="srf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#363639"/><stop offset="1" stop-color="#242426"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b9dff"/><stop offset="1" stop-color="#8b86ff"/></linearGradient><filter id="mid" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="260" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feOffset in="b" dx="5" dy="5" result="o1"/><feFlood flood-color="#1a1a1c"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-5" dy="-5" result="o2"/><feFlood flood-color="#3c3c40"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="sm" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="260" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feOffset in="b" dx="3.5" dy="3.5" result="o1"/><feFlood flood-color="#1a1a1c"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-3.5" dy="-3.5" result="o2"/><feFlood flood-color="#3c3c40"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="in" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="260" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="4" dy="4" result="o1"/>
      <feGaussianBlur in="o1" stdDeviation="4.5" result="b1"/>
      <feComposite in="SourceAlpha" in2="b1" operator="out" result="inv1"/>
      <feFlood flood-color="#1a1a1c"/><feComposite in2="inv1" operator="in" result="sh1"/>
      <feOffset in="SourceAlpha" dx="-4" dy="-4" result="o2"/>
      <feGaussianBlur in="o2" stdDeviation="4.5" result="b2"/>
      <feComposite in="SourceAlpha" in2="b2" operator="out" result="inv2"/>
      <feFlood flood-color="#3c3c40"/><feComposite in2="inv2" operator="in" result="sh2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh1"/><feMergeNode in="sh2"/></feMerge>
    </filter><filter id="in2" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="260" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="2.5" dy="2.5" result="o1"/>
      <feGaussianBlur in="o1" stdDeviation="3" result="b1"/>
      <feComposite in="SourceAlpha" in2="b1" operator="out" result="inv1"/>
      <feFlood flood-color="#1a1a1c"/><feComposite in2="inv1" operator="in" result="sh1"/>
      <feOffset in="SourceAlpha" dx="-2.5" dy="-2.5" result="o2"/>
      <feGaussianBlur in="o2" stdDeviation="3" result="b2"/>
      <feComposite in="SourceAlpha" in2="b2" operator="out" result="inv2"/>
      <feFlood flood-color="#3c3c40"/><feComposite in2="inv2" operator="in" result="sh2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh1"/><feMergeNode in="sh2"/></feMerge>
    </filter></defs>
  <rect width="720" height="260" rx="28" fill="#2c2c2f"/>
  <circle cx="100" cy="130" r="54" fill="url(#srf)" filter="url(#mid)"/>
  <circle cx="100" cy="130" r="41" fill="#2c2c2f" filter="url(#in)"/>
  <text x="100" y="142" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="url(#txt)">MA</text>
  <g><circle cx="100" cy="76" r="3.5" fill="#5b9dff"/>
    <animateTransform attributeName="transform" type="rotate" values="0 100 130;360 100 130" dur="12s" repeatCount="indefinite"/></g>

  <text x="190" y="64" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#86868d">MERHABA  ·  HELLO</text>
  <text x="188" y="104" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#efeff1">Mustafa <tspan fill="url(#txt)">Açık</tspan></text>
  <text x="190" y="131" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#5b9dff">Bilgisayar Mühendisi · Araştırma Görevlisi</text>
  <text x="190" y="152" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" fill="#b6b6bc">Computer Engineer · Research Assistant</text>
  <text x="190" y="172" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#86868d">Karamanoğlu Mehmetbey Üniversitesi / University</text>

  <rect x="190" y="190" width="318" height="30" rx="15" fill="#2c2c2f" filter="url(#in2)"/>
  <circle cx="207" cy="205" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="219" y="209.5" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#b6b6bc">Şu an: Tez çalışması  ·  Now: Working on thesis</text>
  <rect x="596" y="78" width="68" height="28" rx="14" fill="#2c2c2f" filter="url(#in2)"/>
  <circle cx="650" cy="92" r="10" fill="url(#srf)" filter="url(#sm)"><animate attributeName="cx" values="650;610;650" dur="6s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="92" r="3" fill="#5b9dff"><animate attributeName="cx" values="650;610;650" dur="6s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1" repeatCount="indefinite"/></circle>
  <rect x="596" y="118" width="68" height="28" rx="14" fill="#2c2c2f" filter="url(#in2)"/>
  <circle cx="610" cy="132" r="10" fill="url(#srf)" filter="url(#sm)"><animate attributeName="cx" values="610;650;610" dur="7.5s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1" repeatCount="indefinite"/></circle>
  <circle cx="610" cy="132" r="3" fill="#5b9dff"><animate attributeName="cx" values="610;650;610" dur="7.5s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1" repeatCount="indefinite"/></circle>
  <rect x="596" y="158" width="68" height="28" rx="14" fill="#2c2c2f" filter="url(#in2)"/>
  <circle cx="650" cy="172" r="10" fill="url(#srf)" filter="url(#sm)"><animate attributeName="cx" values="650;610;650" dur="9s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="172" r="3" fill="#5b9dff"><animate attributeName="cx" values="650;610;650" dur="9s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1" repeatCount="indefinite"/></circle>
</svg>
