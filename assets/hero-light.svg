<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Mustafa Açık — Bilgisayar Mühendisi · Computer Engineer">
  <defs><linearGradient id="srf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eff0f3"/><stop offset="1" stop-color="#d9dbe0"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6df2"/><stop offset="1" stop-color="#6a5cf2"/></linearGradient><filter id="big" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="360" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="b"/>
      <feOffset in="b" dx="10" dy="10" result="o1"/><feFlood flood-color="#b1b5bf"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-10" dy="-10" result="o2"/><feFlood flood-color="#ffffff"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="mid" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="360" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feOffset in="b" dx="7" dy="7" result="o1"/><feFlood flood-color="#b1b5bf"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-7" dy="-7" result="o2"/><feFlood flood-color="#ffffff"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="in" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="360" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="5" dy="5" result="o1"/>
      <feGaussianBlur in="o1" stdDeviation="5" result="b1"/>
      <feComposite in="SourceAlpha" in2="b1" operator="out" result="inv1"/>
      <feFlood flood-color="#b1b5bf"/><feComposite in2="inv1" operator="in" result="sh1"/>
      <feOffset in="SourceAlpha" dx="-5" dy="-5" result="o2"/>
      <feGaussianBlur in="o2" stdDeviation="5" result="b2"/>
      <feComposite in="SourceAlpha" in2="b2" operator="out" result="inv2"/>
      <feFlood flood-color="#ffffff"/><feComposite in2="inv2" operator="in" result="sh2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh1"/><feMergeNode in="sh2"/></feMerge>
    </filter><filter id="in2" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="360" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="3" dy="3" result="o1"/>
      <feGaussianBlur in="o1" stdDeviation="3" result="b1"/>
      <feComposite in="SourceAlpha" in2="b1" operator="out" result="inv1"/>
      <feFlood flood-color="#b1b5bf"/><feComposite in2="inv1" operator="in" result="sh1"/>
      <feOffset in="SourceAlpha" dx="-3" dy="-3" result="o2"/>
      <feGaussianBlur in="o2" stdDeviation="3" result="b2"/>
      <feComposite in="SourceAlpha" in2="b2" operator="out" result="inv2"/>
      <feFlood flood-color="#ffffff"/><feComposite in2="inv2" operator="in" result="sh2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh1"/><feMergeNode in="sh2"/></feMerge>
    </filter></defs>
  <rect width="720" height="360" rx="32" fill="#e4e5e9"/>
  <rect x="40" y="40" width="640" height="280" rx="36" fill="url(#srf)" filter="url(#big)"/>
  <circle cx="150" cy="180" r="76" fill="url(#srf)" filter="url(#mid)"/>
  <circle cx="150" cy="180" r="58" fill="#e4e5e9" filter="url(#in)"/>
  <text x="150" y="198" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="800" fill="url(#txt)">MA</text>
  <g><circle cx="150" cy="96" r="5" fill="#2f6df2"/>
    <animateTransform attributeName="transform" type="rotate" values="0 150 180;360 150 180" dur="12s" repeatCount="indefinite"/></g>

  <text x="264" y="106" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="3.5" fill="#8a909c">MERHABA  ·  HELLO</text>
  <text x="262" y="160" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="800" fill="#262a31">Mustafa <tspan fill="url(#txt)">Açık</tspan></text>
  <text x="264" y="194" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#2f6df2">Bilgisayar Mühendisi · Araştırma Görevlisi</text>
  <text x="264" y="220" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#566070">Computer Engineer · Research Assistant</text>
  <text x="264" y="244" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8a909c">Karamanoğlu Mehmetbey Üniversitesi / University</text>

  <rect x="262" y="262" width="390" height="42" rx="21" fill="#e4e5e9" filter="url(#in2)"/>
  <circle cx="285" cy="283" r="5.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="302" y="288" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#566070">Şu an: Tez çalışması  ·  Now: Working on thesis</text>
</svg>
