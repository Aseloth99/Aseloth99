  <text x="360" y="176" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="#2d3748">Mustafa <tspan fill="url(#txt)">Açık</tspan></text>
