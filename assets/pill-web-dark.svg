<svg xmlns="http://www.w3.org/2000/svg" width="250" height="76" viewBox="0 0 250 76" role="img" aria-label="macik.com.tr">
  <defs><linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6aa5ff"/><stop offset="1" stop-color="#9a9cff"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#383e48"/><stop offset="1" stop-color="#22262c"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6aa5ff" stop-opacity="0"/><stop offset="0.5" stop-color="#6aa5ff" stop-opacity="0.4"/><stop offset="1" stop-color="#6aa5ff" stop-opacity="0"/></linearGradient><filter id="btn" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
