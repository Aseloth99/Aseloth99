<svg xmlns="http://www.w3.org/2000/svg" width="720" height="288" viewBox="0 0 720 288" role="img" aria-label="Türkçe: Araştırma ilgi alanları">
  <defs><linearGradient id="srf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#363639"/><stop offset="1" stop-color="#242426"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b9dff"/><stop offset="1" stop-color="#8b86ff"/></linearGradient><filter id="sm" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="288" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feOffset in="b" dx="3.5" dy="3.5" result="o1"/><feFlood flood-color="#1a1a1c"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-3.5" dy="-3.5" result="o2"/><feFlood flood-color="#3c3c40"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="chip" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="288" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/>
      <feOffset in="b" dx="3" dy="3" result="o1"/><feFlood flood-color="#1a1a1c"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-3" dy="-3" result="o2"/><feFlood flood-color="#3c3c40"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="in" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="288" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="4" dy="4" result="o1"/>
      <feGaussianBlur in="o1" stdDeviation="4.5" result="b1"/>
      <feComposite in="SourceAlpha" in2="b1" operator="out" result="inv1"/>
      <feFlood flood-color="#1a1a1c"/><feComposite in2="inv1" operator="in" result="sh1"/>
      <feOffset in="SourceAlpha" dx="-4" dy="-4" result="o2"/>
      <feGaussianBlur in="o2" stdDeviation="4.5" result="b2"/>
      <feComposite in="SourceAlpha" in2="b2" operator="out" result="inv2"/>
      <feFlood flood-color="#3c3c40"/><feComposite in2="inv2" operator="in" result="sh2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh1"/><feMergeNode in="sh2"/></feMerge>
    </filter><filter id="in2" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="288" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="2.5" dy="2.5" result="o1"/>
      <feGaussianBlur in="o1" stdDeviation="3" result="b1"/>
      <feComposite in="SourceAlpha" in2="b1" operator="out" result="inv1"/>
      <feFlood flood-color="#1a1a1c"/><feComposite in2="inv1" operator="in" result="sh1"/>
      <feOffset in="SourceAlpha" dx="-2.5" dy="-2.5" result="o2"/>
      <feGaussianBlur in="o2" stdDeviation="3" result="b2"/>
      <feComposite in="SourceAlpha" in2="b2" operator="out" result="inv2"/>
      <feFlood flood-color="#3c3c40"/><feComposite in2="inv2" operator="in" result="sh2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh1"/><feMergeNode in="sh2"/></feMerge>
    </filter></defs>
  <rect width="720" height="288" rx="28" fill="#2c2c2f"/>
  <rect x="36" y="38" width="4" height="16" rx="2" fill="#5b9dff"/>
  <text x="48" y="51" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" letter-spacing="2.5" fill="#5b9dff">ARAŞTIRMA İLGİ ALANLARI</text>
  <rect x="576" y="28" width="112" height="36" rx="18" fill="#2c2c2f" filter="url(#in)"/>
  <rect x="580" y="32" width="52" height="28" rx="14" fill="url(#srf)" filter="url(#sm)"/>
  <circle cx="593" cy="46" r="3.5" fill="#4ade80"/>
  <text x="612" y="50.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" letter-spacing="1" fill="#efeff1">TR</text>
  <text x="658" y="50.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="1" fill="#86868d">EN</text>
  <rect x="36" y="84" width="316" height="76" rx="20" fill="url(#srf)" filter="url(#sm)"/>
  <circle cx="72" cy="122" r="21" fill="#2c2c2f" filter="url(#in2)"/>
  <g transform="translate(72 122)"><path d="M-9 7 C0 7 0 -7 9 -7" fill="none" stroke="#5b9dff" stroke-width="2.2" stroke-linecap="round"/><circle cx="-9" cy="7" r="2.8" fill="#5b9dff"/><circle cx="9" cy="-7" r="2.8" fill="#5b9dff"/></g>
  <text x="104" y="118" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#efeff1">Rota ve şarj optimizasyonu</text>
  <text x="104" y="139" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#b6b6bc">Elektrikli araçlar · EVRoute</text>
  <rect x="368" y="84" width="316" height="76" rx="20" fill="url(#srf)" filter="url(#sm)"/>
  <circle cx="404" cy="122" r="21" fill="#2c2c2f" filter="url(#in2)"/>
  <g transform="translate(404 122)"><rect x="-10" y="-6" width="18" height="12" rx="2.5" fill="none" stroke="#5b9dff" stroke-width="2.2"/><line x1="11" y1="-2.5" x2="11" y2="2.5" stroke="#5b9dff" stroke-width="2.2" stroke-linecap="round"/><rect x="-6.5" y="-2.5" width="8" height="5" rx="1" fill="#5b9dff"/></g>
  <text x="436" y="118" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#efeff1">Batarya SoC / SoH kestirimi</text>
  <text x="436" y="139" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#b6b6bc">LSTM ağlarıyla</text>
  <rect x="36" y="176" width="316" height="76" rx="20" fill="url(#srf)" filter="url(#sm)"/>
  <circle cx="72" cy="214" r="21" fill="#2c2c2f" filter="url(#in2)"/>
  <g transform="translate(72 214)"><path d="M-2 -8 Q-0.8 0.8 6 2 Q-0.8 3.2 -2 12 Q-3.2 3.2 -10 2 Q-3.2 0.8 -2 -8 Z" fill="#5b9dff" transform="translate(1 -2)"/><path d="M7 -11 Q7.5 -7.5 11 -7 Q7.5 -6.5 7 -3 Q6.5 -6.5 3 -7 Q6.5 -7.5 7 -11 Z" fill="#5b9dff"/></g>
  <text x="104" y="210" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#efeff1">Yapay zekâ</text>
  <text x="104" y="231" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#b6b6bc">Projeler ve araştırma</text>
  <rect x="368" y="176" width="316" height="76" rx="20" fill="url(#srf)" filter="url(#sm)"/>
  <circle cx="404" cy="214" r="21" fill="#2c2c2f" filter="url(#in2)"/>
  <g transform="translate(404 214)"><rect x="-6.5" y="-6.5" width="13" height="13" rx="2.5" fill="none" stroke="#5b9dff" stroke-width="2.2"/><rect x="-2.5" y="-2.5" width="5" height="5" rx="1" fill="#5b9dff"/><path d="M-3 -6.5 V-10 M3 -6.5 V-10 M-3 6.5 V10 M3 6.5 V10 M-6.5 -3 H-10 M-6.5 3 H-10 M6.5 -3 H10 M6.5 3 H10" stroke="#5b9dff" stroke-width="2" stroke-linecap="round"/></g>
  <text x="436" y="210" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#efeff1">Gömülü sistemler ve IoT</text>
  <text x="436" y="231" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#b6b6bc">Kendi projelerim</text>
