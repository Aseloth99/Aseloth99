<svg xmlns="http://www.w3.org/2000/svg" width="720" height="288" viewBox="0 0 720 288" role="img" aria-label="English">
  <defs><linearGradient id="srf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eff0f3"/><stop offset="1" stop-color="#d9dbe0"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6df2"/><stop offset="1" stop-color="#6a5cf2"/></linearGradient><filter id="sm" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="288" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feOffset in="b" dx="3.5" dy="3.5" result="o1"/><feFlood flood-color="#b1b5bf"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-3.5" dy="-3.5" result="o2"/><feFlood flood-color="#ffffff"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="chip" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="288" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/>
      <feOffset in="b" dx="3" dy="3" result="o1"/><feFlood flood-color="#b1b5bf"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-3" dy="-3" result="o2"/><feFlood flood-color="#ffffff"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="in" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="288" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="4" dy="4" result="o1"/>
      <feGaussianBlur in="o1" stdDeviation="4.5" result="b1"/>
      <feComposite in="SourceAlpha" in2="b1" operator="out" result="inv1"/>
      <feFlood flood-color="#b1b5bf"/><feComposite in2="inv1" operator="in" result="sh1"/>
      <feOffset in="SourceAlpha" dx="-4" dy="-4" result="o2"/>
      <feGaussianBlur in="o2" stdDeviation="4.5" result="b2"/>
      <feComposite in="SourceAlpha" in2="b2" operator="out" result="inv2"/>
      <feFlood flood-color="#ffffff"/><feComposite in2="inv2" operator="in" result="sh2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh1"/><feMergeNode in="sh2"/></feMerge>
    </filter></defs>
  <rect width="720" height="288" rx="28" fill="#e4e5e9"/>
  <rect x="32" y="28" width="656" height="48" rx="24" fill="#e4e5e9" filter="url(#in)"/>
  <rect x="363" y="33" width="320" height="38" rx="19" fill="url(#srf)" filter="url(#sm)"/>
  <circle cx="387" cy="52" r="4" fill="#22c55e"/>
  <text x="197" y="57.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#8a909c">TR  ·  Türkçe</text>
  <text x="523" y="57.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#262a31">EN  ·  English</text>

  <rect x="36" y="104" width="4" height="16" rx="2" fill="#2f6df2"/>
  <text x="48" y="117" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="800" letter-spacing="2.5" fill="#2f6df2">ABOUT</text>
  <text x="36" y="148" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#566070">I'm a Computer Engineer and Research Assistant at Karamanoğlu</text>
  <text x="36" y="173" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#566070">Mehmetbey University. I build my own projects in software, AI and</text>
  <text x="36" y="198" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#566070">embedded/IoT; right now I'm focused on my thesis.</text>
  <rect x="36" y="222" width="110" height="36" rx="18" fill="url(#srf)" filter="url(#chip)"/>
  <circle cx="55" cy="240" r="3.5" fill="#2f6df2"/>
  <text x="68" y="245" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#262a31">Software</text>
  <rect x="156" y="222" width="62" height="36" rx="18" fill="url(#srf)" filter="url(#chip)"/>
  <circle cx="175" cy="240" r="3.5" fill="#2f6df2"/>
  <text x="188" y="245" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#262a31">AI</text>
  <rect x="228" y="222" width="158" height="36" rx="18" fill="url(#srf)" filter="url(#chip)"/>
  <circle cx="247" cy="240" r="3.5" fill="#2f6df2"/>
  <text x="260" y="245" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#262a31">Embedded / IoT</text>
  <rect x="396" y="222" width="134" height="36" rx="18" fill="url(#srf)" filter="url(#chip)"/>
  <circle cx="415" cy="240" r="3.5" fill="#2f6df2"/>
  <text x="428" y="245" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#262a31">3D Printing</text>
  <rect x="540" y="222" width="70" height="36" rx="18" fill="url(#srf)" filter="url(#chip)"/>
  <circle cx="559" cy="240" r="3.5" fill="#2f6df2"/>
  <text x="572" y="245" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#262a31">Web</text>
</svg>
