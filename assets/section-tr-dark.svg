  <circle cx="72" cy="473" r="5" fill="#5b9dff"/>
  <text x="90" y="479" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17.5" font-weight="600" fill="#efeff1">3B Baskı</text>
  <rect x="204" y="446" width="97" height="54" rx="27" fill="url(#srf)" filter="url(#chip)"/>
