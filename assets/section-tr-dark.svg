<svg xmlns="http://www.w3.org/2000/svg" width="720" height="548" viewBox="0 0 720 548" role="img" aria-label="Türkçe">
  <defs><linearGradient id="srf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#363639"/><stop offset="1" stop-color="#242426"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b9dff"/><stop offset="1" stop-color="#8b86ff"/></linearGradient><filter id="card" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="548" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feOffset in="b" dx="9" dy="9" result="o1"/><feFlood flood-color="#1a1a1c"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-9" dy="-9" result="o2"/><feFlood flood-color="#3c3c40"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="sm" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="548" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feOffset in="b" dx="5" dy="5" result="o1"/><feFlood flood-color="#1a1a1c"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-5" dy="-5" result="o2"/><feFlood flood-color="#3c3c40"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="chip" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="548" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="b"/>
      <feOffset in="b" dx="4" dy="4" result="o1"/><feFlood flood-color="#1a1a1c"/><feComposite in2="o1" operator="in" result="s1"/>
      <feOffset in="b" dx="-4" dy="-4" result="o2"/><feFlood flood-color="#3c3c40"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><filter id="in" filterUnits="userSpaceOnUse" x="0" y="0" width="720" height="548" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="5" dy="5" result="o1"/>
      <feGaussianBlur in="o1" stdDeviation="5" result="b1"/>
      <feComposite in="SourceAlpha" in2="b1" operator="out" result="inv1"/>
      <feFlood flood-color="#1a1a1c"/><feComposite in2="inv1" operator="in" result="sh1"/>
      <feOffset in="SourceAlpha" dx="-5" dy="-5" result="o2"/>
      <feGaussianBlur in="o2" stdDeviation="5" result="b2"/>
      <feComposite in="SourceAlpha" in2="b2" operator="out" result="inv2"/>
      <feFlood flood-color="#3c3c40"/><feComposite in2="inv2" operator="in" result="sh2"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh1"/><feMergeNode in="sh2"/></feMerge>
    </filter></defs>
  <rect width="720" height="548" rx="32" fill="#2c2c2f"/>
  <rect x="36" y="36" width="648" height="72" rx="36" fill="#2c2c2f" filter="url(#in)"/>
  <rect x="44" y="44" width="312" height="56" rx="28" fill="url(#srf)" filter="url(#sm)"/>
  <circle cx="76" cy="72" r="5.5" fill="#4ade80"/>
  <text x="200" y="79" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#efeff1">TR  ·  Türkçe</text>
  <text x="520" y="79" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#86868d">EN  ·  English</text>

  <rect x="36" y="132" width="648" height="216" rx="32" fill="url(#srf)" filter="url(#card)"/>
  <rect x="72" y="158" width="6" height="22" rx="3" fill="#5b9dff"/>
  <text x="92" y="176" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#5b9dff">HAKKIMDA</text>
  <text x="72" y="218" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#b6b6bc">Karamanoğlu Mehmetbey Üniversitesi'nde Bilgisayar</text>
  <text x="72" y="248" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#b6b6bc">Mühendisi ve Araştırma Görevlisiyim. Yazılım, yapay</text>
  <text x="72" y="278" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#b6b6bc">zekâ ve gömülü/IoT alanlarında kendi projelerimi</text>
  <text x="72" y="308" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#b6b6bc">geliştiriyorum; şu an tez çalışmamla ilgileniyorum.</text>
