  <circle cx="72" cy="403" r="5" fill="#5b9dff"/>
  <text x="90" y="409" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17.5" font-weight="600" fill="#efeff1">Yazılım</text>
  <rect x="195" y="376" width="166" height="54" rx="27" fill="url(#srf)" filter="url(#chip)"/>
  <circle cx="223" cy="403" r="5" fill="#5b9dff"/>
